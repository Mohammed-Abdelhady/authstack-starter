packages:
  - backend
  - frontend
  - mobile/*
  - packages/*
  - shared/*

overrides:
  diff: '>=8.0.3'
  lodash: ^4.18.1
  '@nestjs/platform-express>multer': 2.4.0

allowBuilds:
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/linux-arm64': true
  '@embedded-postgres/linux-x64': true
  '@parcel/watcher': true
  '@scarf/scarf': false
  '@swc/core': true
  bcrypt: true
  fsevents: true
  mongodb-memory-server: true
  unrs-resolver: true

# The installer builds its template in prebuild before bundling the CLI.
enablePrePostScripts: true

# A release has to be a day old (1440 minutes) before it can be installed.
minimumReleaseAge: 1440

# A package too new for the release-age cooldown stops the install. Without
# this, pnpm adds an exception to this file by itself and carries on.
minimumReleaseAgeStrict: true
