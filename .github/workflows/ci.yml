name: CI

on:
  pull_request:
    branches: [staging, master]
    types: [opened, synchronize, reopened]
  push:
    branches: [staging, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'push' && github.run_id || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  range-scan:
    name: Hard-ban range
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Scan event commits
        run: node scripts/ci.mjs --range

  quality:
    name: Quality gates
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - name: Resolve Mongo binary cache
        id: mongo
        run: node scripts/ci.mjs --cache
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.mongo.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.mongo.outputs.key }}
      - name: Install dependencies
        run: node scripts/ci.mjs --install
      - name: Run quality gates
        run: node scripts/ci.mjs --quality

  # repository-only:start
  # No runner has timed these jobs: GitHub Actions is off for this repository.
  # Each limit is the slower of two runs measured alone on a 12-core Mac, plus
  # 185 s (the most either run spent outside its tests), times 2 for a 4-vCPU
  # runner (an assumption) and times 1.5 for headroom, rounded up to 5 minutes.
  installer:
    name: Installer combinations
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    # The four older slow files: 652 to 827 s of tests, so 1012 s at most.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - name: Resolve Mongo binary cache
        id: mongo
        run: node scripts/ci.mjs --cache
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.mongo.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.mongo.outputs.key }}
      - name: Install dependencies
        run: node scripts/ci.mjs --install
      - name: Test generated projects
        run: node scripts/ci.mjs --installer

  installer-postgres:
    name: Installer PostgreSQL projects
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    # Five PostgreSQL projects: 704 to 719 s of tests, so 904 s at most.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - name: Install dependencies
        run: node scripts/ci.mjs --install
      - name: Test generated projects
        run: node scripts/ci.mjs --installer-postgres

  installer-mongodb:
    name: Installer MongoDB projects
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    # Two MongoDB projects: 841 to 1360 s of tests, so 1545 s at most. The two
    # cases may take 30 minutes each before they fail by their own budget.
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - name: Resolve Mongo binary cache
        id: mongo
        run: node scripts/ci.mjs --cache
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.mongo.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.mongo.outputs.key }}
      - name: Install dependencies
        run: node scripts/ci.mjs --install
      - name: Test generated projects
        run: node scripts/ci.mjs --installer-mongodb
  # repository-only:end
